<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration - Yog-Guru</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;   
      object-fit: cover;    
    }
    .reg-hero {
      position: relative;
      min-height: 90vh;
      background: url('BG2.avif') center/cover no-repeat;
      display: flex;
      align-items: center;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
    }
    .reg-box {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 600px;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark text-light shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
      <img src="iconY.PNG" alt="Logo" class="logo">
      <span class="Yoga-line fw-bold">Yog-Guru</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="read_more2.html">Gallery</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contus.html">Contact-Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="dow.html">Registration</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="reg-hero">
  <div class="overlay"></div>
  <div class="container py-5">
    <div class="reg-box mx-auto text-dark">
      <h2 class="mb-3 fw-bold text-primary">Member Registration</h2>
      <p class="text-muted mb-4">Register here to gain access to premium guided meditation videos & routines.</p>

      <form id="regForm">
        <div class="mb-3">
          <label class="form-label fw-bold">Full Name</label>
          <input type="text" name="UN" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Email Address</label>
          <input type="email" name="EA" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Date of Birth</label>
            <input type="date" name="DOB" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Contact Number</label>
            <input type="tel" name="Con" class="form-control" placeholder="Mobile number" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold d-block">Gender</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="G" id="gMale" value="Male" required checked>
            <label class="form-check-label" for="gMale">Male</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="G" id="gFemale" value="Female">
            <label class="form-check-label" for="gFemale">Female</label>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Country</label>
          <input type="text" name="C" class="form-control" placeholder="India" required>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">Register Now</button>
          <button type="reset" class="btn btn-outline-secondary">Reset</button>
        </div>
      </form>
    </div>
  </div>
</div>

<footer class="container my-5 p-4 footer-glass text-light bg-dark shadow-sm text-center">
  <div class="footer fs-5">Meditation.com © 2026 Sakshi Rai. <a href="#" class="text-info text-decoration-none">· Privacy · Terms</a></div>
</footer>

<script>
document.getElementById('regForm').addEventListener('submit', function(e) {
  e.preventDefault();
  window.location.href = 'dow_lod.html';
});
</script>
</body>
</html>
